<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>作品ステージ | Rikemen Creative Coding Lab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./assets/css/gallery.css" />
  </head>
  <body>
    <div class="exhibition-room">
      <header class="exhibition-bar">
        <div class="exhibition-bar__left">
          <a id="back-to-detail-link" href="./detail.html" class="nav-back-btn">
            ← 作品概要へ戻る
          </a>
          <a id="back-to-index-link" href="./index.html" class="nav-sub-link">
            カード一覧
          </a>
          <span class="exhibition-bar__divider" aria-hidden="true"></span>
          <div class="exhibition-bar__meta">
            <span id="exhibition-number" class="exhibition-bar__number"></span>
            <h1 id="exhibition-title" class="exhibition-bar__title"></h1>
          </div>
        </div>

        <div class="exhibition-bar__right">
          <!-- ローカル学習環境（localhost）のときのみ表示される Start / End 切替スイッチ -->
          <div id="mode-switch" class="mode-switch" role="group" aria-label="教材モード切替" hidden>
            <button id="btn-mode-start" type="button" class="mode-switch__btn" aria-pressed="false">
              Start（ハンズオン用）
            </button>
            <button id="btn-mode-end" type="button" class="mode-switch__btn" aria-pressed="true">
              End（完成版）
            </button>
          </div>
        </div>
      </header>

      <div class="exhibition-stage">
        <iframe
          id="artwork-iframe"
          class="artwork-iframe"
          title="メディアアート作品キャンバス"
          allow="fullscreen"
        ></iframe>
      </div>
    </div>

    <script type="module" src="./assets/js/exhibition.js"></script>
  </body>
</html>
